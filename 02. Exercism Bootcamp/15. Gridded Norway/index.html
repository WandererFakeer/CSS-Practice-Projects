      <!-- Third row -->

      <div class="blue"></div>

      <!-- Fourth row -->
      <div class="white"></div>

      <div class="blue"></div>

      <!-- Fifth row -->
      <div class="red"></div>

      <div class="blue"></div>
      <div class="white"></div>
      <div class="red"></div>
    </div>
