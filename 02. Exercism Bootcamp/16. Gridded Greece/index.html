<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Greece Flag</title>
  </head>
  <body>
    <div class="container grid-container">
      <div class="upper">
        <div class="upper-left">
          <!-- First row -->
          <div class="blue"></div>
          <div class="white"></div>
          <div class="blue"></div>

          <!-- Second row -->
          <div class="blue"></div>
          <div class="white"></div>
          <div class="blue"></div>

          <!-- Third row -->
          <div class="white"></div>
          <div class="white"></div>
          <div class="white"></div>

          <!-- Fourth row -->
          <div class="blue"></div>
          <div class="white"></div>
          <div class="blue"></div>

          <!-- Fifth row -->
          <div class="blue"></div>
          <div class="white"></div>
          <div class="blue"></div>
        </div>

        <div class="upper-right">
          <div class="blue"></div>
          <div class="white"></div>
          <div class="blue"></div>
          <div class="white"></div>
          <div class="blue"></div>
        </div>
      </div>

      <div class="lower">
        <div class="white"></div>
        <div class="blue"></div>
        <div class="white"></div>
        <div class="blue"></div>
      </div>
    </div>
  </body>
</html>
