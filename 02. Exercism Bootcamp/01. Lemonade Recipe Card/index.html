<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Lemonade Recipe Card</title>
  </head>
  <body>
    <main class="container">
      <article class="recipe grid-container-gap">
        <h1 class="heading">Honey lemon water</h1>

        <ul class="ingredient-list grid-ingredient-list-gap">
          <li class="ingredient">1 tbsp honey</li>
          <li class="ingredient">1/2 lemon, juiced</li>
          <li class="ingredient">1 cup warm water</li>
        </ul>

        <p class="process">
          Stir the honey and juice into the water until mixed. Drink slowly and
          enjoy!
        </p>

        <p class="tagline">Best enjoyed first thing in the morning 🍋</p>
      </article>
    </main>
  </body>
</html>
