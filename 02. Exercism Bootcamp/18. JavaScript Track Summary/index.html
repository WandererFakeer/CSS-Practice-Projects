<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Exercism JavaScript Track Summary</title>
  </head>
  <body>
    <div class="container flex-container">
      <img src="javascript.svg" alt="JavaScript Icon" class="javascript" />

      <section class="javascript-track-record">
        <h2 class="track-heading">JavaScript</h2>

        <div class="progress-bar">
          <div class="complete-bar"></div>
          <div class="incomplete-bar"></div>
        </div>

        <p class="track-record-calculation">30 / 150 exercises completed</p>
      </section>

      <img src="chevron-gray.svg" alt="Chevron Icon" class="chevron" />
    </div>
  </body>
</html>
