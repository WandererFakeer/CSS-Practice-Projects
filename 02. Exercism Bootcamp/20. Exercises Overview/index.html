<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Exercism Exercises Overview</title>
  </head>
  <body>
    <div class="container grid-container-gap">
      <p class="line">
        You've completed
        <span class="color">20%</span>
        <span class="bold">. Greate work! 🚀</span>
      </p>

      <div class="progress-bar-and-js-logo">
        <div class="progress-bar">
          <div class="completed-progress"></div>
          <div class="remaining-progress"></div>
        </div>
        <img
          src="javascript-tight.svg"
          alt="JavaScript Logo on Progress Bar"
          class="js-logo"
        />
      </div>

      <div class="exercise-circle-container">
        <!-- First row -->
        <div class="completed"></div>
        <div class="completed"></div>
        <div class="completed"></div>
        <div class="completed"></div>
        <div class="completed"></div>
        <div class="completed"></div>
        <div class="completed"></div>
        <div class="completed"></div>
        <div class="completed"></div>
        <div class="in-progress"></div>
        <div class="in-progress"></div>
        <div class="available"></div>

        <!-- Second row -->
        <div class="available"></div>
        <div class="in-progress"></div>
        <div class="completed"></div>
        <div class="available"></div>
        <div class="in-progress"></div>
        <div class="in-progress"></div>
        <div class="available"></div>
        <div class="available"></div>
        <div class="in-progress"></div>
        <div class="completed"></div>
        <div class="available"></div>
        <div class="available"></div>

        <!-- Third row -->
        <div class="available"></div>
        <div class="available"></div>
        <div class="available"></div>
        <div class="available"></div>
        <div class="available"></div>
        <div class="available"></div>
        <div class="available"></div>
        <div class="available"></div>
        <div class="available"></div>
        <div class="available"></div>
        <div class="available"></div>
        <div class="available"></div>

        <!-- Fourth row -->
        <div class="available"></div>
        <div class="available"></div>
        <div class="available"></div>
        <div class="available"></div>
        <div class="available"></div>
        <div class="available"></div>
        <div class="available"></div>
        <div class="available"></div>
        <div class="available"></div>
        <div class="available"></div>
        <div class="available"></div>
        <div class="available"></div>
      </div>
    </div>
  </body>
</html>
