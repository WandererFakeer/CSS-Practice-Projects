<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Exercism Bootcamp Features</title>
  </head>
  <body>
    <div class="container flex-container">
      <div class="card card-container">
        <img src="bc-live.svg" alt="Live Icon on Card" class="icon" />
        <div class="tag"><span class="bold">Live</span> teaching</div>
      </div>

      <div class="card card-container">
        <img src="bc-fun.svg" alt="Fun Icon on Card" class="icon" />
        <div class="tag"><span class="bold">Fun</span> projects</div>
      </div>

      <div class="card card-container">
        <img src="bc-help.svg" alt="Help Icon on Card" class="icon" />
        <div class="tag">Helpful <span class="bold">mentors</span></div>
      </div>
    </div>
  </body>
</html>
