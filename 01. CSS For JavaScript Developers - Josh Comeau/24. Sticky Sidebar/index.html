<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Sticky Sidebar</title>
  </head>
  <body>
    <div class="container">
      <nav class="sidebar">
        <h1 class="heading">Navigation</h1>

        <ul class="nav-list">
          <li class="list-item">Section One</li>
          <li class="list-item">Section Two</li>
        </ul>
      </nav>

      <main class="main-section">
        <article class="card">
          <p class="main-para">
            This container contains random stuff to increase its height.
          </p>

          <img
            src="assets/cat.jpg"
            alt="Cat with its tongue sticking out in a blurry background"
            class="image"
          />
        </article>

        <article class="card">
          <p class="main-para">
            Normally, a blog post would exist in this container.
          </p>
          <img
            src="assets/dog.jpg"
            alt="puppy with orange background"
            class="image"
          />
        </article>
      </main>
    </div>
  </body>
</html>
