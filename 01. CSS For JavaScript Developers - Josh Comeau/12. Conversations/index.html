<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Conversations</title>
  </head>
  <body>
    <ol class="container">
      <li class="messages sent">Can you get me a big salad?</li>
      <li class="messages received">
        What big salad? I'm going to the coffee shop.
      </li>
      <li class="sent messages">They have big salads.</li>
      <li class="received messages">I've never seen a big salad.</li>
      <li class="sent messages">They have a big salad.</li>
      <li class="received messages">Is that what I ask for?</li>
      <li class="received messages">The <em>Big</em> salad?</li>
    </ol>
  </body>
</html>
