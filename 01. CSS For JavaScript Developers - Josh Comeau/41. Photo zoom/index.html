<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Photo zoom</title>
  </head>
  <body>
    <main class="gallery">
      <a href="" class="photo-link">
        <img src="assets/1.jpg" alt="A balloon store" class="photo" />
      </a>

      <a href="" class="photo-link">
        <img
          src="assets/2.jpg"
          alt="A good-boy dog. Black and white."
          class="photo"
        />
      </a>

      <a href="" class="photo-link">
        <img
          src="assets/3.jpg"
          alt="A cardboard standing-desk tool."
          class="photo"
        />
      </a>

      <a href="" class="photo-link">
        <img
          src="assets/4.jpg"
          alt="A “tokyo drift” style sports car"
          class="photo"
        />
      </a>

      <a href="" class="photo-link">
        <img
          src="assets/5.jpg"
          alt="A person amongst daisies in a field"
          class="photo"
        />
      </a>
    </main>
  </body>
</html>
