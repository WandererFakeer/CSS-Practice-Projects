<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Module 6 Workshop - Unsprinkle</title>
  </head>
  <body>
    <!-- 01. Header section -->
    <header class="header">
      <nav class="nav">
        <h1><a href="#home" class="logo">Unsprinkle</a></h1>

        <input type="text" placeholder="Search..." class="search-bar" />

        <nav class="nav-right">
          <ul class="nav-right-list">
            <li class="nav-list">
              <a href="#categories" class="nav-link">Categories</a>
            </li>

            <li class="nav-list">
              <a href="#submissions" class="nav-link">Submissions</a>
            </li>

            <li class="nav-list">
              <a href="#sign-up" class="nav-link">Sign Up</a>
            </li>
          </ul>
        </nav>
      </nav>
    </header>

    <!-- 02. Main section -->
    <main class="main">
      <img src="assets/hero-img.jpg" alt="Hero Image" class="hero-img" />

      <img
        src="assets/1.jpg"
        alt="A kingfisher bird sits on a twig"
        class="gallary-imgs"
      />

      <img
        src="assets/2.jpg"
        alt="Grey dog during daytime"
        class="gallary-imgs"
      />

      <img
        src="assets/3.jpg"
        alt="Fox on green grass field during daytime"
        class="gallary-imgs"
      />

      <img
        src="assets/4.jpg"
        alt="selective focus photo of giraffe"
        class="gallary-imgs"
      />

      <img
        src="assets/5.jpg"
        alt="Brown short coated dog in orange hoodie"
        class="gallary-imgs"
      />

      <img
        src="assets/6.jpg"
        alt="Gray cat standing in two feet"
        class="gallary-imgs"
      />

      <img
        src="assets/7.jpg"
        alt="Green crested lizard in Singapore"
        class="gallary-imgs"
      />

      <img
        src="assets/8.jpg"
        alt="Brown squirrel on black background"
        class="gallary-imgs"
      />

      <img
        src="assets/9.jpg"
        alt="Brown turtle swimming underwater"
        class="gallary-imgs"
      />
    </main>
  </body>
</html>
