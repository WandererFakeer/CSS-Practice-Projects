<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Photo Viewer</title>
  </head>
  <body>
    <aside class="photo-viewer">
      <a href="" class="cat-1">
        <img src="assets/cat.jpg" alt="Cat in bushy background" class="image" />
      </a>

      <a href="" class="dog">
        <img
          src="assets/dog.jpg"
          alt="Puppy in indoor with orange background"
          class="image"
        />
      </a>

      <a href="" class="cat-2">
        <img src="assets/cat.jpg" alt="Cat in bushy background" class="image" />
      </a>

      <div class="buttons">
        <button class="click">Previous</button>
        <button class="click">Next</button>
      </div>
    </aside>
  </body>
</html>
